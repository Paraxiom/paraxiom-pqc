[package]
name = "paraxiom-pqc"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Paraxiom post-quantum cryptography — pure Rust, zero C. Unified API for ML-KEM, ML-DSA, SLH-DSA, and Falcon."
repository = "https://github.com/Paraxiom/paraxiom-pqc"
keywords = ["post-quantum", "cryptography", "ml-kem", "ml-dsa", "falcon"]
categories = ["cryptography"]
exclude = ["lean/.lake/**", "lean/lake-manifest.json", "lean/.lake"]

[dependencies]
# Pinned to exact versions: these are pre-release (rc.*) crates and the API
# breaks across rc bumps (e.g., ml-dsa::SigningKey::from_seed → to_seed
# between rc.7 and rc.9). Bump deliberately, not via caret resolution.
ml-kem = { version = "=0.3.0-rc.0", features = ["getrandom"] }    # FIPS 203
ml-dsa = { version = "=0.1.0-rc.7", features = ["rand_core"] }    # FIPS 204 (rand_core: hedged signing)
slh-dsa = "=0.2.0-rc.4"                                           # FIPS 205
falcon-rs = "=0.2.3"                                              # FIPS 206 (pending)

# Common — use getrandom directly, avoid rand_core version conflicts
getrandom = "0.3"
rand_core = "0.10"                                               # hedged/randomized ML-DSA signing (matches ml-dsa)
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false
