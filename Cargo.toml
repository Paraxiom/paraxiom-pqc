[package]
name = "paraxiom-pqc"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Paraxiom post-quantum cryptography — pure Rust, zero C. Unified API for ML-KEM, ML-DSA, SLH-DSA, and Falcon."
repository = "https://github.com/Paraxiom/paraxiom-pqc"
keywords = ["post-quantum", "cryptography", "ml-kem", "ml-dsa", "falcon"]
categories = ["cryptography"]
exclude = ["lean/.lake/**", "lean/lake-manifest.json", "lean/.lake"]

[workspace]
members = [
    ".",
    "vendor/ml-dsa-fork"
]
exclude = ["vendor/slh-dsa-patch"]

[dependencies]
# Pinned to exact versions
ml-kem = { version = "=0.3.0-rc.0", features = ["getrandom"] }
ml-dsa = { version = "=0.1.0-rc.7", features = ["rand_core"] }
slh-dsa = "=0.2.0-rc.4"
falcon-rs = "=0.2.3"

# Common dependencies
getrandom = "0.3"
rand_core = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[patch.crates-io]
"ml-dsa" = { path = "vendor/ml-dsa-fork" }
"slh-dsa" = { path = "vendor/slh-dsa-patch" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false