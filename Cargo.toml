[package]
name = "paraxiom-pqc"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-only"
description = "Paraxiom post-quantum cryptography in pure Rust, with no C code. One API for ML-KEM, ML-DSA, SLH-DSA and Falcon."
repository = "https://github.com/Paraxiom/paraxiom-pqc"
keywords = ["post-quantum", "cryptography", "ml-kem", "ml-dsa", "falcon"]
categories = ["cryptography"]
exclude = ["lean/.lake/**", "lean/lake-manifest.json", "lean/.lake"]

[workspace]
members = [
    ".",
    "vendor/ml-dsa-fork"
]
exclude = ["vendor/slh-dsa-patch"]

[dependencies]
# Pinned to exact versions.
# ml-kem powers the KEM; ml-dsa/slh-dsa/falcon-rs power the `sign` feature.
# The signature crates are optional so KEM-only consumers can build without
# them (the ml-dsa rc needs the vendored fork to compile
# against modern pkcs8/spki; KEM-only builds sidestep that entirely).
# `zeroize` makes the backends clear their own key structs on drop (falcon-rs always does).
ml-kem = { version = "=0.3.0-rc.0", features = ["getrandom", "zeroize"] }
ml-dsa = { path = "vendor/ml-dsa-fork", features = ["rand_core", "zeroize"], optional = true }
slh-dsa = { path = "vendor/slh-dsa-patch", features = ["zeroize"], optional = true }
falcon-rs = { version = "=0.2.3", optional = true }

# Common dependencies
getrandom = "0.3"
rand_core = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

# Optional: `qrng` feature, SHAKE256 entropy conditioning for QRNG-seeded keygen.
sha3 = { version = "0.11", optional = true }

[features]
# `sign` is on by default so existing consumers are unaffected. KEM-only
# consumers use `default-features = false` to drop ml-dsa/slh-dsa/falcon-rs.
default = ["sign"]
# Digital signatures: ML-DSA (FIPS 204), SLH-DSA (FIPS 205), Falcon.
sign = ["dep:ml-dsa", "dep:slh-dsa", "dep:falcon-rs"]
# Falcon verification only (`paraxiom_pqc::falcon`), without ml-dsa/slh-dsa.
falcon-verify = ["dep:falcon-rs"]
# Seed post-quantum key generation from a pluggable quantum entropy source
# (QKD/QRNG hardware). Off by default: the default build uses the OS RNG.
qrng = ["dep:sha3"]
# Crypto-agile key combiner (ADR 0001): QKD, ML-KEM and pre-shared secrets into one key.
combiner = ["dep:sha3"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

# Signing timing harness; needs the signature schemes.
[[example]]
name = "dudect_timing"
required-features = ["sign"]
