[package]
# Published under its own name so that paraxiom-pqc never resolves to upstream ml-dsa,
# which lacks the zeroization and fixed-round signing changes made here.
name = "paraxiom-ml-dsa"
version = "0.1.0-rc.7"
license = "Apache-2.0 OR MIT"
description = "Paraxiom fork of RustCrypto ml-dsa 0.1.0-rc.7 (FIPS 204) with key zeroization and fixed-round signing, used by paraxiom-pqc. Use upstream ml-dsa unless you need these changes."
repository = "https://github.com/Paraxiom/paraxiom-pqc"
readme = "README.md"
keywords = ["ml-dsa", "fips204", "signature", "post-quantum"]
categories = ["cryptography"]
exclude = ["Cargo.toml.orig", "Cargo.toml.bak", ".cargo_vcs_info.json", ".cargo-ok", "WP2_VISIBILITY_CHANGES.md"]
edition = "2021"
autotests = false
autobenches = false
autoexamples = false

[lib]
name = "ml_dsa"
path = "src/lib.rs"

[features]
# Add these features so the parent crate can enable them
default = ["rand_core"]
rand_core = ["dep:rand_core", "signature/rand_core"]
alloc = ["pkcs8?/alloc"]
# Same definition as upstream ml-dsa 0.1.0-rc.7. Without the two sub-features the
# `zeroize` feature does not compile (the key vectors and arrays lack `Zeroize`).
zeroize = ["dep:zeroize", "hybrid-array/zeroize", "module-lattice/zeroize"]
pkcs8 = ["dep:const-oid", "dep:pkcs8"]

[dependencies]
module-lattice = { version = "0.1.0-rc.1" }
hybrid-array = { version = "0.4", features = ["extra-sizes"] }
sha3 = { version = "0.11", default-features = false }
signature = { version = "3.0", default-features = false, features = ["digest"] }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
const-oid = { version = "0.10", features = ["db"], optional = true }
rand_core = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true, default-features = false }

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", features = ["serde"] }
hex-literal = "1"
pkcs8 = { version = "0.11", features = ["pem"] }

[[test]]
name = "pkcs8"
path = "tests/pkcs8.rs"