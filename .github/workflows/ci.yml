name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build (locked)
        run: cargo build --locked --all-features --verbose
      - name: Test (locked)
        run: cargo test --locked --all-features --verbose
      - name: Clippy (informational)
        run: cargo clippy --all-targets --all-features
        continue-on-error: true
      - name: Format check (informational)
        run: cargo fmt --all --check
        continue-on-error: true

  falcon-guard:
    name: Falcon guard on a target without hardware square root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # riscv64gc has an FPU, but libm takes square roots in software there, so Falcon key
      # generation and signing must not be built (sign::FALCON_SIGNING_AVAILABLE is false).
      # This type-checks the refusing path in src/sign.rs and the tests that cover it.
      - name: Check the refusing Falcon path (locked)
        run: cargo check --locked --all-features --lib --tests --target riscv64gc-unknown-linux-gnu

  zero-c:
    name: no C in the library's dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails when the default, KEM-only or full feature set, on any target, pulls in a crate that
      # compiles C or binds a C library (scripts/check-zero-c.sh lists them). The fuzz harness in
      # fuzz/ is a separate workspace and is not checked.
      - name: No C in the dependency graph (locked)
        run: bash scripts/check-zero-c.sh
